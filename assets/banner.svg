<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Nexus Tools banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1c2330"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c74ff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g font-family="-apple-system, Segoe UI, Roboto, sans-serif">
    <text x="80" y="150" font-size="72" font-weight="800" fill="#e6edf3">🧰 Nexus Tools</text>
    <text x="84" y="205" font-size="30" fill="#9aa5b1">Everyday utilities that run 100% in your browser.</text>
    <g transform="translate(84,250)" font-size="20" fill="#e6edf3">
      <rect x="0" y="0" width="150" height="40" rx="20" fill="#161b22" stroke="#2a313c"/>
      <text x="24" y="26">🔒 Private</text>
      <rect x="166" y="0" width="150" height="40" rx="20" fill="#161b22" stroke="#2a313c"/>
      <text x="190" y="26">📴 Offline</text>
      <rect x="332" y="0" width="196" height="40" rx="20" fill="#161b22" stroke="#2a313c"/>
      <text x="356" y="26">🪶 Zero deps</text>
      <rect x="544" y="0" width="210" height="40" rx="20" fill="#161b22" stroke="#2a313c"/>
      <text x="568" y="26">⚡ No build step</text>
    </g>
    <rect x="80" y="312" width="1040" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
