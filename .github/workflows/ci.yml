name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          # Lint every shell script in the toolchain (-x follows `source`d files).
          find . -type f \( -name '*.sh' -o -name 'nexus' \) -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -x

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash tests/run.sh
