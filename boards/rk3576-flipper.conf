# Board: Flipper One (Rockchip RK3576)
BOARD_NAME="flipper-one"
ARCH="arm64"
SOC="rk3576"

# Partition Offsets (Sector units - 512 bytes)
# Optimized for Rockchip Bootloader requirements
LOADER_START=64
SYSTEM_A_START=32768     # 16MB offset
SYSTEM_B_START=2129920   # 1GB offset for A/B redundancy
USERDATA_START=4227072

# Kernel Parameters for Immutable Boot
BOOT_ARGS="ro rootwait console=ttyFIQ0 earlycon=uart8250,mmio32,0xff130000"
